name: 'QuantumSafe Sentinel Scan'
description: 'Scans your codebase and configurations for quantum-vulnerable cryptography.'
author: 'QuantumSafe Sentinel'

inputs:
  target_dir:
    description: 'The directory to scan.'
    required: false
    default: '.'
  fail_on:
    description: 'The risk level threshold to fail the action (Critical, High, Medium, Low)'
    required: false
    default: 'High'
  github_token:
    description: 'GitHub token for posting PR comments'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # Core models + parsing for static scanning. httpx is needed because
        # --auto-fix opens PRs via the GitHub API; keep it in step with
        # backend/cli/scan_cli.py's imports or the scan fails to start.
        pip install pydantic cryptography httpx

    - name: Run QuantumSafe Scan
      id: run_scan
      shell: bash
      run: |
        echo "Running scan on ${{ inputs.target_dir }}..."
        
        # Determine script directory
        SCRIPT_DIR="${{ github.action_path }}/../../../backend/cli"
        if [ ! -f "$SCRIPT_DIR/scan_cli.py" ]; then
          # Fallback if action is consumed differently
          SCRIPT_DIR="backend/cli"
        fi
        
        # Run scan and capture JSON output to file, allow it to fail but capture the exit code
        set +e
        python "$SCRIPT_DIR/scan_cli.py" "${{ inputs.target_dir }}" --format json --fail-on "${{ inputs.fail_on }}" > scan_results.json
        EXIT_CODE=$?
        set -e
        
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

    - name: Generate PR Comment
      if: github.event_name == 'pull_request'
      shell: python
      run: |
        import json
        import os

        try:
            with open('scan_results.json', 'r') as f:
                results = json.load(f)
        except Exception as e:
            print(f"Error loading scan results: {e}")
            with open('comment.md', 'w') as f:
                f.write("### 🛡️ QuantumSafe Sentinel Scan Failed\n\nFailed to generate scan results.")
            exit(0)

        findings = results.get('findings', [])
        total = results.get('total_findings', 0)
        target = results.get('target', '')

        with open('comment.md', 'w') as f:
            f.write(f"### 🛡️ QuantumSafe Sentinel Scan Results\n\n")
            f.write(f"**Target:** `{target}`\n")
            f.write(f"**Total Findings:** {total}\n\n")
            
            if total == 0:
                f.write("✅ **No quantum-vulnerable cryptography detected.**\n")
            else:
                f.write("| Risk | File | Line | Algorithm | Context | Usage |\n")
                f.write("|------|------|------|-----------|---------|-------|\n")
                for finding in findings:
                    risk = finding.get('risk_score', 'Unknown')
                    icon = "🚨" if risk in ["Critical", "High"] else ("⚠️" if risk == "Medium" else "ℹ️")
                    
                    file_path = finding.get('file', 'N/A')
                    # Make path relative to workspace for cleaner display
                    workspace = os.environ.get('GITHUB_WORKSPACE', '')
                    if file_path.startswith(workspace):
                        file_path = file_path[len(workspace):].lstrip('/')
                        
                    line = finding.get('line', '-')
                    algo = finding.get('algorithm', 'Unknown')
                    ctx = finding.get('context', 'Unknown')
                    usage = finding.get('usage_type', 'Unknown')
                    
                    f.write(f"| {icon} {risk} | `{file_path}` | {line} | {algo} | {ctx} | {usage} |\n")

    - name: Post PR Comment
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md

    - name: Evaluate Exit Code
      shell: bash
      run: |
        CODE="${{ steps.run_scan.outputs.exit_code }}"
        # 0 = clean, 2 = findings met the threshold, anything else = the
        # scanner itself failed. Reporting a crash as "vulnerabilities found"
        # sends PR authors hunting for crypto problems that don't exist.
        if [ "$CODE" -eq 0 ]; then
          echo "Scan passed successfully."
        elif [ "$CODE" -eq 2 ]; then
          echo "::error::QuantumSafe scan detected vulnerabilities meeting or exceeding the threshold (${{ inputs.fail_on }})."
          exit 1
        else
          echo "::error::QuantumSafe scan failed to run (exit code $CODE). This is a scanner/configuration error, not a cryptographic finding. Check the 'Run QuantumSafe Scan' step log."
          exit 1
        fi
